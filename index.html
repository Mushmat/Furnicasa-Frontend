<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Furnicasa — Made-to-order furniture, built to last</title>
    <meta
      name="description"
      content="Sofas, beds and dining sets built to order in solid hardwood and shipped direct across India. Free delivery over ₹10,000, one-year warranty."
    />
    <meta name="theme-color" content="#0D0B0A" />

    <!--  favicons / PWA icons  -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/images/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/images/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/images/favicon/apple-touch-icon.png"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/assets/images/favicon/site.webmanifest" />

    <!-- Google Fonts are pulled in from index.css; warm the connection early -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Razorpay checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js" async></script>
  </head>

  <body>
    <div id="root"></div>

    <!-- Vite rewrites this to /assets/index-xxxx.js in production -->
    <script type="module" src="/src/main.jsx"></script>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </body>
</html>
